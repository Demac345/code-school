<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        div:hover {
            transform: scale(1.05);
            transition: transform 0.3s ease-in-out;
            box-shadow: 10px 10px 20px black;
        }
        img:hover {
            transform: scale(1.05);
            transition: transform 0.3s ease-in-out;
            box-shadow: 5px 5px 10px grey;
        }
        button {
            background: silver;
            color: black;
            border: none;
            padding: 10px 20px;
            cursor: pointer;
            box-shadow: 3px 3px 3px grey;
            border-radius: 5px;
        }
        button:hover {
            background-color: black;
            color: silver;
        }   
    </style>
</head>
<body style="background: linear-gradient(45deg, black, grey); background-size: cover; background-position: center; width: 100%; height: 100vh; overflow: hidden; margin: 0;">

        <p>i love building websites and learning new technologies. i enjoy turning ideas into real projects.</p>
        <button>contact me</button>

    </div>
</body>
</html>
